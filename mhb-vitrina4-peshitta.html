   "Todo lo que va a ver en este museo viajó hacia el poniente: de Jerusalén a Roma, a España, a Alemania, a Inglaterra, y de ahí cruzando el mar hasta aquí. Esta vitrina es la otra mitad de la historia: la rama que se fue hacia el oriente.",
