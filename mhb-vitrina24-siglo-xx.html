   "Six Bibles in a single case, from either side of the ocean, made at almost the same time. And all six were born of the same document.",
   "On the thirtieth of September 1943, Pope Pius the Twelfth published the encyclical Divino afflante Spiritu. In it he at last authorised Catholics to translate the Bible directly from the Hebrew and the Greek, and not from the Latin Vulgate. For four centuries the Church had been translating from Latin. That day the door opened.",
