            "Es la Vita Christi, la Vida de Cristo, que escribió en latín un religioso alemán de la orden de la Cartuja, en el siglo catorce, Ludolfo de Sajonia, prior en Coblenza, que dedicó buena parte de su vida a escribir en latín una Vita Christi, una Vida de Cristo. No fue un libro más: se copió a mano por cientos, se imprimió en cuanto hubo imprenta y fue uno de los libros más leídos de toda la Edad Media europea.",
