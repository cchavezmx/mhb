<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Biblia del Cántaro — Museo de Historia de la Biblia</title>
<style>
  :root{ --fondo:#F0F0E8;--claro:#FAFAF3;--tinta:#1B1C16;--cabecera:#2E4A2E;--acento:#7A8A3A;--marca:rgba(122,138,58,.3); }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--tinta);
    font-family:"Iowan Old Style",Georgia,"Palatino Linotype",Palatino,serif;
    font-size:20px;line-height:1.62;-webkit-text-size-adjust:100%;}
  .hoja{max-width:40rem;margin:0 auto;padding:0 0 4rem}
  header{background:var(--cabecera);color:var(--claro);padding:2.2rem 1.4rem 2rem;
         display:flex;gap:1.3rem;align-items:center}
  .sala{font-size:.78em;margin:0 0 .45rem;opacity:.85}
  h1{font-size:1.8em;line-height:1.12;margin:0;font-weight:600}
  .siglo{margin:.5rem 0 0;font-size:.85em;font-style:italic;opacity:.88}
  
  .cant{flex:none;display:flex;align-items:flex-end;gap:7px}
  .cant b{display:block;width:30px;height:38px;background:var(--acento);border-radius:6px 6px 14px 14px;position:relative}
  .cant b:after{content:'';position:absolute;left:8px;top:-8px;width:14px;height:10px;background:var(--acento);border-radius:3px 3px 0 0}
  .cant i{display:block;width:5px;height:50px;background:var(--cabecera);border-radius:3px;position:relative}
  .cant i:after{content:'';position:absolute;left:-10px;top:-6px;width:25px;height:16px;background:var(--cabecera);border-radius:50%;opacity:.85}

  main{padding:0 1.4rem}
  .idiomas{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.6rem 0 1.2rem}
  .idiomas button{font:inherit;font-size:.88em;padding:.6rem 1rem;min-height:48px;
    background:transparent;color:var(--tinta);border:1.5px solid rgba(40,32,25,.35);border-radius:2px;cursor:pointer}
  .idiomas button[aria-pressed="true"]{background:var(--cabecera);color:var(--claro);border-color:var(--cabecera)}
  .idiomas button:focus-visible,.control:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
  .mandos{display:flex;gap:.6rem;align-items:center;margin:0 0 1.8rem}
  .control{font:inherit;font-size:1em;display:inline-flex;align-items:center;gap:.55rem;
    padding:.85rem 1.5rem;min-height:52px;background:var(--acento);color:#FFF6E6;border:none;border-radius:2px;cursor:pointer}
  .control.secundario{background:transparent;color:var(--tinta);border:1.5px solid rgba(40,32,25,.35);padding:.85rem 1.1rem}
  .control[hidden]{display:none}
  .aviso{font-size:.8em;font-style:italic;margin:-1.2rem 0 1.8rem;color:#7a5c3e}
  p.parrafo{margin:0 0 1.15rem;transition:background-color .25s}
  p.parrafo.sonando{background:var(--marca);box-shadow:0 0 0 .35rem var(--marca)}
  footer{margin:2.8rem 1.4rem 0;padding-top:1.2rem;border-top:1px solid rgba(40,32,25,.25);
         font-size:.8em;font-style:italic;color:#7a5c3e}
  @media (prefers-reduced-motion:reduce){p.parrafo{transition:none}}
</style>
  <link rel="stylesheet" href="menu-nav.css">
  <script src="menu-nav.js" defer></script>
</head>

    <h1 id="ui-titulo"></h1>
    <p class="siglo" id="ui-siglo"></p>

</main>

const $ = id => document.getElementById(id);
let actual = "es", audio = null;

function pintarIdiomas(){
  $("idiomas").innerHTML = "";
  Object.keys(GUIA).forEach(k=>{
    const b = document.createElement("button");
    b.textContent = GUIA[k].nombre;
    b.setAttribute("aria-pressed", k===actual);
    b.onclick = ()=>{ detener(); actual = k; pintar(); };
    $("idiomas").appendChild(b);
  });
}
function pintar(){
  const g = GUIA[actual];
  document.documentElement.lang = actual;
  $("ui-sala").textContent = g.ui.sala;
  $("ui-titulo").textContent = g.ui.titulo;
  $("ui-siglo").textContent = g.ui.siglo;
  $("ui-play").textContent = g.ui.play;
  $("ui-stop").textContent = g.ui.stop;
  $("ui-pie").textContent = g.ui.pie;
  $("ui-aviso").hidden = true;
  $("texto").innerHTML = "";
  g.t.forEach((p,i)=>{
    const el = document.createElement("p");
    el.className = "parrafo"; el.id = "p"+i; el.textContent = p;
    $("texto").appendChild(el);
  });
  pintarIdiomas();
}
function marcar(i){
  document.querySelectorAll(".parrafo.sonando").forEach(e=>e.classList.remove("sonando"));
  if(i>=0){ const el = $("p"+i); if(el) el.classList.add("sonando"); }
}
function detener(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(audio){ audio.pause(); audio = null; }
  marcar(-1);
  $("btn-stop").hidden = true;
  $("btn-play").hidden = false;
}

// Preferencias de voz: primero la región (México), luego el timbre masculino.
const REGION = { es:["es-MX","es-US","es-419","es"], en:["en-US","en-GB","en"], fr:["fr-FR","fr"], de:["de-DE","de"], it:["it-IT","it"] };
const HOMBRES = ["juan","jorge","diego","carlos","miguel","male","hombre","masculino","alex","aaron","daniel","fred","thomas","nicolas","mathieu","markus","yannick","hans","stefan","luca","federico","cosimo","alessio"];
const MUJERES = ["paulina","monica","mónica","angelica","angélica","esperanza","marisol","samantha","karen","moira","tessa","amelie","amélie","audrey","anna","petra","katja","alice","elsa","female","mujer","femenino"];

function elegirVoz(codigo){
  const vs = (window.speechSynthesis ? speechSynthesis.getVoices() : []);
  if(!vs.length) return null;
  const base = codigo.slice(0,2);
  for(const reg of (REGION[base] || [base])){
    const cand = vs.filter(v => v.lang.replace("_","-").toLowerCase().startsWith(reg.toLowerCase()));
    if(!cand.length) continue;
    const h = cand.find(v => HOMBRES.some(n => v.name.toLowerCase().includes(n)));
    if(h) return h;
    const neutra = cand.find(v => !MUJERES.some(n => v.name.toLowerCase().includes(n)));
    return neutra || cand[0];
  }
  return null;
}
function hayVoz(codigo){
  if(!window.speechSynthesis) return false;
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return true;
  return vs.some(v => v.lang.slice(0,2) === codigo.slice(0,2));
}
function escuchar(){
  const g = GUIA[actual];
  detener();
  $("btn-play").hidden = true;
  $("btn-stop").hidden = false;
  if(GRABACIONES[actual]){
    audio = new Audio(GRABACIONES[actual]);
    audio.onended = detener;
    audio.play();
    return;
  }
  if(!window.speechSynthesis || !hayVoz(g.voz)){
    $("ui-aviso").textContent = g.ui.aviso;
    $("ui-aviso").hidden = false;
    detener();
    return;
  }
  const vozElegida = elegirVoz(g.voz);
  g.t.forEach((p,i)=>{
    const u = new SpeechSynthesisUtterance(p);
    u.lang = g.voz; u.rate = 0.92;
    if(vozElegida) u.voice = vozElegida;
    u.onstart = ()=>marcar(i);
    if(i===g.t.length-1) u.onend = detener;
    speechSynthesis.speak(u);
  });
}
$("btn-play").onclick = escuchar;
$("btn-stop").onclick = detener;
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = ()=>{};
pintar();
