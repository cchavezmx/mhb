          t: [
            "Cuarenta y dos renglones por columna. Ese es el nombre técnico de este libro: la Biblia de 42 líneas. Y es el objeto que parte en dos la historia del mundo.",
            "Maguncia, Alemania, 1,455. Un orfebre llamado Juan Gutenberg lleva años trabajando casi en secreto. Su idea no fue la imprenta: en China ya se imprimía. Su idea fue fundir cada letra por separado, en metal, para armar una página, imprimirla, deshacer los tipos y volver a armarlos con otras palabras, así creo la imprenta de tipos intercambiables o tipos móviles.",
            "Y antes de seguir, mire la pieza pequeña de esta misma vitrina: la Biblia Pauperum, la Biblia de los pobres. Es un libro xilográfico, impreso antes que éste, tallando la página entera en una plancha de madera. Compárelas. Eso es lo que Gutenberg cambió: no inventó la impresión, inventó poder usar una y otra vez las mismas letras.",
            "Ahora, entre las dos piezas, deténgase y reflexione un momento en estas palabras. Son del libro de Job, y se escribieron más de mil años antes que cualquiera de estos libros.",
            "Quién diera que mis palabras quedaran escritas. Quién diera que se grabaran en un libro, con punzón de hierro y con plomo, esculpidas en la roca para siempre. (Job 19:23-24).",
            "Job pedía un libro. Y pedía hierro y plomo. Dos mil años después, un orfebre de Maguncia grabó punzones de hierro y fundió letras de plomo y, así, cumplió el deseo sin proponérselo. ¿Y qué escogió imprimir? Pudo escoger cualquier cosa, pero escogió la Biblia.",
            "Mire la página y notará algo curioso: no parece impresa. Gutenberg quiso que su libro pareciera un manuscrito. Cortó cerca de doscientos noventa tipos distintos, sólo para imitar las ligaduras y las abreviaturas del copista. Las capitulares y los adornos en rojo se pintaron después, a mano, uno por uno.",
            "Se hicieron unos ciento ochenta ejemplares: la mayoría en papel, unos cuarenta y cinco en pergamino. Hoy sobreviven cuarenta y ocho, y sólo veintiuno completos. Hace décadas que no sale uno entero a la venta.",
            "La historia no terminó bien para él. Gutenberg no tenía dinero: se lo prestó un socio, Johann Fust. Cuando la Biblia estaba por terminarse, Fust lo demandó, ganó el pleito y se quedó con el taller y con los libros. El hombre que inventó la imprenta murió sin ella.",
            "Y ahora piense en lo que cambió. Copiar una Biblia a mano le costaba a un monje dos o tres años de su vida. De este taller salieron ciento ochenta en ese mismo tiempo. El Libro dejó de ser pieza única, hecha para un rey, y empezó a multiplicarse.",
            "Ochenta y cuatro años después, en 1539, llegaba a la ciudad de México la primera imprenta del continente americano. De Maguncia hasta acá, en menos de un siglo.",
            "Hasta aquí hemos visto: Un libro para un monje. Un libro para un rey niño. Un libro para una reina. Y desde aquí, por fin, un libro para todos. Falta ver cómo ese libro volvió a sus lenguas originales, y cómo desde ahí llegó a la nuestra.",
          ],

          t: [
            "Forty-two lines to a column. That is the technical name of this book: the forty-two-line Bible. And it is the object that cuts the history of the world in two.",
            "Mainz, Germany, 1455. A goldsmith named Johannes Gutenberg has spent years working almost in secret. His idea was not printing: China was already printing. His idea was to cast every letter separately, in metal, so that a page could be assembled, printed, taken apart, and the very same letters used again for the next page. Movable type.",
            "And before we go on, look at the small piece in this same case: the Biblia Pauperum, the Bible of the poor. It is a block book, printed before this one, with the whole page carved into a single wooden plate. Compare them. That is what Gutenberg changed: he did not invent printing, he invented being able to take it apart and use the same letters again.",
            "Now, between the two pieces, stop and think for a moment about these words. They come from the book of Job, and they were written more than a thousand years before any of these books.",
            "Oh that my words were written down. Oh that they were engraved in a book, with an iron stylus and with lead, cut into the rock for ever. (Job 19:23-24).",
            "Job was asking for a book. And he was asking for iron and lead. Two thousand years later, a goldsmith in Mainz cut iron punches and cast letters of lead, and so granted his wish without meaning to. And what did he choose to print? He could have chosen anything. He chose the Bible.",
            "Look at the page and you will notice something curious: it does not look printed. Gutenberg wanted his book to look like a manuscript. He cut some two hundred and ninety different pieces of type, purely to imitate the ligatures and abbreviations of the copyist. The initials and the red ornament were painted afterwards, by hand, one by one.",
            "About one hundred and eighty copies were made: most on paper, some forty-five on vellum. Forty-eight survive today, and only twenty-one of them complete. It is decades since a whole copy came up for sale.",
            "The story did not end well for him. Gutenberg had no money: a partner, Johann Fust, lent it to him. When the Bible was almost finished, Fust took him to court, won, and kept the workshop and the books. The man who invented printing died without it.",
            "And now think about what changed. Copying a Bible by hand cost a monk two or three years of his life. From this workshop came one hundred and eighty in that same span of time. The Book stopped being a unique object, made for a king, and began to multiply.",
            "Eighty-four years later, in 1539, the first printing press of the American continent arrived in Mexico City. From Mainz to here, in less than a century.",
            "A book for a monk. A book for a boy king. A book for a queen. And from here, at last, a book for everyone. What remains to be seen is how that book found its way back to its original languages, and how from there it reached our own.",
          ],

            "Quarante-deux lignes par colonne. C'est le nom technique de ce livre : la Bible à quarante-deux lignes. Et c'est l'objet qui coupe en deux l'histoire du monde.",
            "Mayence, Allemagne, 1455. Un orfèvre nommé Johannes Gutenberg travaille depuis des années presque en secret. Son idée n'était pas l'imprimerie : en Chine, on imprimait déjà. Son idée fut de fondre chaque lettre séparément, en métal, pour composer une page, l'imprimer, la défaire, et recomposer la suivante avec les mêmes lettres. Les caractères mobiles.",
            "Et avant d'aller plus loin, regardez la petite pièce de cette même vitrine : la Biblia Pauperum, la Bible des pauvres. C'est un livre xylographique, imprimé avant celui-ci, la page entière gravée dans une planche de bois. Comparez-les. Voilà ce que Gutenberg a changé : il n'a pas inventé l'impression, il a inventé de pouvoir la défaire et réemployer les mêmes lettres.",
            "Maintenant, entre les deux pièces, arrêtez-vous et réfléchissez un instant à ces mots. Ils viennent du livre de Job, et furent écrits plus de mille ans avant aucun de ces livres.",
            "Qui donnera que mes paroles soient écrites. Qui donnera qu'elles soient gravées dans un livre, avec un poinçon de fer et avec du plomb, taillées dans le roc pour toujours. (Job 19:23-24).",
            "Job demandait un livre. Et il demandait du fer et du plomb. Deux mille ans plus tard, un orfèvre de Mayence grava des poinçons de fer et fondit des lettres de plomb, et exauça ainsi son vœu sans le vouloir. Et qu'a-t-il choisi d'imprimer ? Il pouvait choisir n'importe quoi. Il a choisi la Bible.",
            "Regardez la page et vous remarquerez une chose curieuse : elle n'a pas l'air imprimée. Gutenberg voulait que son livre ressemble à un manuscrit. Il a gravé près de deux cent quatre-vingt-dix caractères différents, uniquement pour imiter les ligatures et les abréviations du copiste. Les initiales et les ornements rouges ont été peints ensuite, à la main, un par un.",
            "On en fit environ cent quatre-vingts exemplaires : la plupart sur papier, quarante-cinq environ sur parchemin. Quarante-huit subsistent aujourd'hui, et vingt et un seulement sont complets. Cela fait des décennies qu'un exemplaire entier n'est pas passé en vente.",
            "L'histoire ne s'est pas bien terminée pour lui. Gutenberg n'avait pas d'argent : un associé, Johann Fust, lui en prêta. Alors que la Bible était presque achevée, Fust lui fit un procès, le gagna, et garda l'atelier et les livres. L'homme qui inventa l'imprimerie mourut sans elle.",
            "Et pensez maintenant à ce qui a changé. Copier une Bible à la main coûtait à un moine deux ou trois années de sa vie. De cet atelier en sortirent cent quatre-vingts dans le même temps. Le Livre cessa d'être une pièce unique, faite pour un roi, et se mit à se multiplier.",
            "Quatre-vingt-quatre ans plus tard, en 1539, la première presse du continent américain arrivait à Mexico. De Mayence jusqu'ici, en moins d'un siècle.",
            "Un livre pour un moine. Un livre pour un roi enfant. Un livre pour une reine. Et à partir d'ici, enfin, un livre pour tous. Il reste à voir comment ce livre est revenu à ses langues d'origine, et comment de là il est parvenu à la nôtre.",
          ],

          t: [
            "Zweiundvierzig Zeilen je Spalte. So heißt dieses Buch mit seinem Fachnamen: die zweiundvierzigzeilige Bibel. Und es ist der Gegenstand, der die Geschichte der Welt in zwei Teile schneidet.",
            "Mainz, Deutschland, 1455. Ein Goldschmied namens Johannes Gutenberg arbeitet seit Jahren fast im Verborgenen. Seine Idee war nicht der Druck: in China wurde bereits gedruckt. Seine Idee war, jeden Buchstaben einzeln in Metall zu gießen, um eine Seite zu setzen, zu drucken, wieder aufzulösen und mit denselben Buchstaben die nächste Seite zu setzen. Bewegliche Lettern.",

            "Nun halten Sie zwischen den beiden Stücken einen Augenblick inne und denken Sie über diese Worte nach. Sie stammen aus dem Buch Hiob und wurden mehr als tausend Jahre vor jedem dieser Bücher geschrieben.",
            "Dass doch meine Worte aufgeschrieben würden. Dass sie doch in ein Buch gegraben würden, mit eisernem Griffel und mit Blei, für immer in den Fels gehauen. (Hiob 19,23-24).",
            "Hiob bat um ein Buch. Und er bat um Eisen und Blei. Zweitausend Jahre später schnitt ein Goldschmied in Mainz eiserne Stempel und goss Lettern aus Blei und erfüllte ihm so den Wunsch, ohne es zu wollen. Und was wählte er zum Drucken? Er hätte alles wählen können. Er wählte die Bibel.",
            "Sehen Sie sich die Seite an, und Ihnen wird etwas Merkwürdiges auffallen: sie wirkt nicht gedruckt. Gutenberg wollte, dass sein Buch wie eine Handschrift aussieht. Er schnitt fast zweihundertneunzig verschiedene Typen, nur um die Ligaturen und Abkürzungen des Schreibers nachzuahmen. Die Initialen und der rote Schmuck wurden nachträglich von Hand gemalt, einer nach dem anderen.",
            "Es entstanden etwa einhundertachtzig Exemplare: die meisten auf Papier, etwa fünfundvierzig auf Pergament. Achtundvierzig haben überdauert, und nur einundzwanzig davon sind vollständig. Seit Jahrzehnten ist kein ganzes Exemplar mehr zum Verkauf gekommen.",
            "Für ihn ging die Geschichte nicht gut aus. Gutenberg hatte kein Geld: ein Teilhaber, Johann Fust, lieh es ihm. Als die Bibel fast fertig war, verklagte Fust ihn, gewann den Prozess und behielt die Werkstatt und die Bücher. Der Mann, der den Buchdruck erfand, starb ohne ihn.",
            "Und nun denken Sie daran, was sich änderte. Eine Bibel von Hand abzuschreiben kostete einen Mönch zwei oder drei Jahre seines Lebens. Aus dieser Werkstatt kamen in derselben Zeit einhundertachtzig. Das Buch war kein Einzelstück mehr, für einen König gemacht, sondern begann sich zu vervielfältigen.",
            "Vierundachtzig Jahre später, im Jahr 1539, kam die erste Druckerpresse des amerikanischen Kontinents nach Mexiko-Stadt. Von Mainz bis hierher, in weniger als einem Jahrhundert.",
            "Ein Buch für einen Mönch. Ein Buch für einen Kinderkönig. Ein Buch für eine Königin. Und von hier an endlich ein Buch für alle. Zu sehen bleibt, wie dieses Buch zu seinen Ursprachen zurückfand und von dort in unsere eigene gelangte.",
          ],

        it: {

            aviso: "Questo telefono non ha una voce italiana. Può leggere il testo.",
          },
          t: [
            "Quarantadue righe per colonna. È questo il nome tecnico del libro: la Bibbia delle quarantadue linee. Ed è l'oggetto che taglia in due la storia del mondo.",
            "Magonza, Germania, 1455. Un orefice di nome Johannes Gutenberg lavora da anni quasi in segreto. La sua idea non fu la stampa: in Cina si stampava già. La sua idea fu fondere ogni lettera separatamente, in metallo, per comporre una pagina, stamparla, disfarla e comporre con le stesse lettere la pagina seguente. I caratteri mobili.",
            "E prima di proseguire, guardi il pezzo piccolo di questa stessa vetrina: la Biblia Pauperum, la Bibbia dei poveri. È un libro xilografico, stampato prima di questo, con l'intera pagina intagliata in una tavola di legno. Li confronti. È questo che Gutenberg cambiò: non inventò la stampa, inventò il poterla disfare e riusare le stesse lettere.",

            "Oh, fossero scritte le mie parole. Oh, fossero incise in un libro, con stilo di ferro e con piombo, scolpite nella roccia per sempre. (Giobbe 19,23-24).",

            "Ne furono fatte circa centottanta copie: la maggior parte su carta, una quarantina su pergamena. Oggi ne sopravvivono quarantotto, e soltanto ventuno complete. Sono decenni che non ne compare una intera sul mercato.",
            "Per lui la storia non finì bene. Gutenberg non aveva denaro: glielo prestò un socio, Johann Fust. Quando la Bibbia era quasi finita, Fust lo citò in giudizio, vinse la causa e si tenne la bottega e i libri. L'uomo che inventò la stampa morì senza di essa.",

            "Un libro per un monaco. Un libro per un re bambino. Un libro per una regina. E da qui, finalmente, un libro per tutti. Resta da vedere come quel libro tornò alle sue lingue originali, e come di lì arrivò alla nostra.",
