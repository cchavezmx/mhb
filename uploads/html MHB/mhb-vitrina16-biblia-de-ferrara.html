<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>La Biblia de Ferrara — Museo de Historia de la Biblia</title>
<style>
  :root{ --fondo:#EFEBE0;--claro:#FAF6EC;--tinta:#1F1C16;--cabecera:#1E3A5F;--acento:#B5912F;--marca:rgba(181,145,47,.3); }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--tinta);
    font-family:"Iowan Old Style",Georgia,"Palatino Linotype",Palatino,serif;
    font-size:20px;line-height:1.62;-webkit-text-size-adjust:100%;}
  .hoja{max-width:40rem;margin:0 auto;padding:0 0 4rem}
  header{background:var(--cabecera);color:var(--claro);padding:2.2rem 1.4rem 2rem;}
  .sala{font-size:.78em;margin:0 0 .45rem;opacity:.85}
  h1{font-size:1.8em;line-height:1.12;margin:0;font-weight:600}
  .siglo{margin:.5rem 0 0;font-size:.85em;font-style:italic;opacity:.88}
  
  .estrella{flex:none;width:64px;height:64px}

  main{padding:0 1.4rem}
  .idiomas{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.6rem 0 1.2rem}
  .idiomas button{font:inherit;font-size:.88em;padding:.6rem 1rem;min-height:48px;
    background:transparent;color:var(--tinta);border:1.5px solid rgba(40,32,25,.35);border-radius:2px;cursor:pointer}
  .idiomas button[aria-pressed="true"]{background:var(--cabecera);color:var(--claro);border-color:var(--cabecera)}
  .idiomas button:focus-visible,.control:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
  .mandos{display:flex;gap:.6rem;align-items:center;margin:0 0 1.8rem}
  .control{font:inherit;font-size:1em;display:inline-flex;align-items:center;gap:.55rem;
    padding:.85rem 1.5rem;min-height:52px;background:var(--acento);color:#FFF6E6;border:none;border-radius:2px;cursor:pointer}
  .control.secundario{background:transparent;color:var(--tinta);border:1.5px solid rgba(40,32,25,.35);padding:.85rem 1.1rem}
  .control[hidden]{display:none}
  .aviso{font-size:.8em;font-style:italic;margin:-1.2rem 0 1.8rem;color:#7a5c3e}
  p.parrafo{margin:0 0 1.15rem;transition:background-color .25s}
  p.parrafo.sonando{background:var(--marca);box-shadow:0 0 0 .35rem var(--marca)}
  footer{margin:2.8rem 1.4rem 0;padding-top:1.2rem;border-top:1px solid rgba(40,32,25,.25);
         font-size:.8em;font-style:italic;color:#7a5c3e}
  @media (prefers-reduced-motion:reduce){p.parrafo{transition:none}}

  .header-marca{display:flex;justify-content:flex-end;margin:0 0 .9rem}
  .logo-mhb{flex:none;width:56px;height:56px;color:var(--claro);opacity:.92}
  .logo-mhb svg{width:100%;height:100%}
  .header-main{display:flex;gap:1.3rem;align-items:center}
  .header-texto{flex:1}
</style>
</head>
<body>
<div class="hoja">
<header><div class="header-marca"><div aria-label="Museo de Historia de la Biblia" class="logo-mhb">
<svg aria-hidden="true" viewBox="0 0 64 64">
<path d="M10 14 h18 v36 h-18 z" fill="currentColor" opacity="0.9"></path>
<path d="M36 14 h18 v36 h-18 z" fill="currentColor" opacity="0.9"></path>
<line stroke="currentColor" stroke-width="2" x1="32" x2="32" y1="12" y2="52"></line>
</svg>
</div></div><div class="header-main"><svg aria-hidden="true" class="estrella" viewBox="0 0 64 64">
<path d="M32 8 L54 46 L10 46 Z" fill="none" stroke="#B5912F" stroke-width="3"></path>
<path d="M32 56 L10 18 L54 18 Z" fill="none" stroke="#B5912F" stroke-width="3"></path></svg><div class="header-texto">
<p class="sala" id="ui-sala"></p>
<h1 id="ui-titulo"></h1>
<p class="siglo" id="ui-siglo"></p>
</div></div></header>
<main>
<div aria-label="Idioma" class="idiomas" id="idiomas" role="group"></div>
<div class="mandos">
<button class="control" id="btn-play">▶ <span id="ui-play">Escuchar</span></button>
<button class="control secundario" hidden="" id="btn-stop"><span id="ui-stop">Detener</span></button>
</div>
<p class="aviso" hidden="" id="ui-aviso"></p>
<div id="texto"></div>
</main>
<footer id="ui-pie">Museo de Historia de la Biblia</footer>
</div>
<script>
// Si pone aquí la URL de un MP3, esa voz sustituye a la del teléfono.
const GRABACIONES = { es:"", en:"", fr:"", de:"", it:"" };
const GUIA = {
 "es": {
  "nombre": "Español",
  "voz": "es-MX",
  "ui": {
   "sala": "Vitrina 16 · Museo de Historia de la Biblia",

   "play": "Escuchar",
   "stop": "Detener",

   "aviso": "Este teléfono no tiene voz en español. Puede leer el texto."
  },
  "t": [
   "Ésta es la Biblia de los que se fueron. En 1,492 los judíos fueron expulsados de España. Salieron con su lengua a cuestas: siguieron hablando castellano en Salónica, en Esmirna, en Ámsterdam, durante siglos. Y en 1,553, en la ciudad italiana de Ferrara, cuyo duque les había dado refugio, imprimieron el Antiguo Testamento en esa lengua que se habían llevado.",
   "La tradujeron dos hombres, y cada uno tenía dos nombres. Abraham Usque, que en Portugal se había llamado Duarte Pinel. Y Yom Tob Atias, que se había llamado Jerónimo de Vargas. Dos nombres cada uno, porque habían vivido fingiendo ser cristianos para sobrevivir. Aquí, por fin, firmaron con el suyo.",
   "Tradujeron del hebreo palabra por palabra, pegados al original hasta donde el castellano aguanta. Por eso suena rara, antigua, con el orden de las frases volteado. No es torpeza: es fidelidad llevada al extremo. Se hicieron dos emisiones. Una dedicada al duque de Ferrara. Otra dedicada a doña Gracia Nasi, la gran señora judía que rescataba refugiados por media Europa.",
   "Y hay un puente que vale la pena que usted conozca. Casiodoro de Reina, el de la Biblia del Oso, usó esta traducción y lo dijo por escrito, con elogios. Un monje católico fugado de Sevilla, apoyándose en el trabajo de unos judíos expulsados de la misma tierra. Los dos desterrados por lo mismo, ayudándose sin conocerse."
  ]
 },
 "en": {
  "nombre": "English",
  "voz": "en-GB",
  "ui": {
   "sala": "Case 16 · Museum of the History of the Bible",
   "titulo": "The Ferrara Bible",
   "siglo": "Ferrara, 1553 · the Sephardic Old Testament",
   "play": "Listen",
   "stop": "Stop",
   "pie": "Museum of the History of the Bible",
   "aviso": "This phone has no English voice available. You can read the text instead."
  },
  "t": [
   "This is the Bible of those who left. In 1492 the Jews were expelled from Spain. They went out carrying their language with them: they went on speaking Spanish in Salonica, in Smyrna, in Amsterdam, for centuries. And in 1553, in the Italian city of Ferrara, whose duke had given them refuge, they printed the Old Testament in that language they had carried away.",
   "Two men translated it, and each of them had two names. Abraham Usque, who in Portugal had been called Duarte Pinel. And Yom Tob Atias, who had been called Jerónimo de Vargas. Two names each, because they had lived pretending to be Christians in order to survive. Here, at last, they signed with their own.",
   "They translated from the Hebrew word for word, clinging to the original as far as Spanish will bear it. That is why it sounds strange, archaic, with the order of the phrases turned around. It is not clumsiness: it is faithfulness carried to the limit. Two issues were made. One dedicated to the Duke of Ferrara. The other dedicated to Doña Gracia Nasi, the great Jewish lady who was rescuing refugees across half of Europe.",
   "And there is a bridge here worth knowing about. Casiodoro de Reina, the man behind the Bear Bible, used this translation and said so in writing, with praise. A Catholic monk on the run from Seville, leaning on the work of Jews expelled from that same land. Both exiled for the same thing, helping each other without ever meeting."
  ]
 },
 "fr": {
  "nombre": "Français",
  "voz": "fr-FR",
  "ui": {
   "sala": "Vitrine 16 · Musée de l'Histoire de la Bible",
   "titulo": "La Bible de Ferrare",
   "siglo": "Ferrare, 1553 · l'Ancien Testament séfarade",
   "play": "Écouter",
   "stop": "Arrêter",
   "pie": "Musée de l'Histoire de la Bible",
   "aviso": "Ce téléphone ne dispose pas d'une voix française. Vous pouvez lire le texte."
  },
  "t": [
   "Voici la Bible de ceux qui sont partis. En 1492, les juifs furent expulsés d'Espagne. Ils partirent avec leur langue sur le dos : ils continuèrent à parler espagnol à Salonique, à Smyrne, à Amsterdam, pendant des siècles. Et en 1553, dans la ville italienne de Ferrare, dont le duc leur avait donné refuge, ils imprimèrent l'Ancien Testament dans cette langue qu'ils avaient emportée.",
   "Deux hommes la traduisirent, et chacun avait deux noms. Abraham Usque, qui au Portugal s'était appelé Duarte Pinel. Et Yom Tob Atias, qui s'était appelé Jerónimo de Vargas. Deux noms chacun, parce qu'ils avaient vécu en feignant d'être chrétiens pour survivre. Ici, enfin, ils signèrent du leur.",
   "Ils traduisirent de l'hébreu mot pour mot, collés à l'original autant que l'espagnol le supporte. C'est pourquoi cela sonne étrange, ancien, avec l'ordre des phrases retourné. Ce n'est pas de la maladresse : c'est la fidélité poussée à l'extrême. Il y eut deux émissions. L'une dédiée au duc de Ferrare. L'autre dédiée à doña Gracia Nasi, la grande dame juive qui sauvait des réfugiés à travers la moitié de l'Europe.",
   "Et il y a là un pont qui mérite d'être connu. Casiodoro de Reina, celui de la Bible de l'Ours, s'est servi de cette traduction et l'a dit par écrit, avec éloges. Un moine catholique en fuite de Séville, s'appuyant sur le travail de juifs expulsés de cette même terre. Tous deux bannis pour la même chose, s'entraidant sans se connaître."
  ]
 },
 "de": {
  "nombre": "Deutsch",
  "voz": "de-DE",
  "ui": {
   "sala": "Vitrine 16 · Museum zur Geschichte der Bibel",
   "titulo": "Die Ferrara-Bibel",
   "siglo": "Ferrara, 1553 · das sephardische Alte Testament",
   "play": "Anhören",
   "stop": "Anhalten",
   "pie": "Museum zur Geschichte der Bibel",
   "aviso": "Dieses Telefon hat keine deutsche Stimme. Sie können den Text lesen."
  },
  "t": [
   "Dies ist die Bibel derer, die fortgingen. 1492 wurden die Juden aus Spanien vertrieben. Sie gingen und trugen ihre Sprache mit sich: sie sprachen weiter Spanisch in Saloniki, in Smyrna, in Amsterdam, jahrhundertelang. Und 1553 druckten sie in der italienischen Stadt Ferrara, deren Herzog ihnen Zuflucht gewährt hatte, das Alte Testament in eben jener Sprache, die sie mitgenommen hatten.",
   "Zwei Männer übersetzten es, und jeder von ihnen hatte zwei Namen. Abraham Usque, der in Portugal Duarte Pinel geheißen hatte. Und Yom Tob Atias, der Jerónimo de Vargas geheißen hatte. Je zwei Namen, weil sie gelebt hatten, indem sie Christen vortäuschten, um zu überleben. Hier unterschrieben sie endlich mit dem eigenen.",
   "Sie übersetzten Wort für Wort aus dem Hebräischen, dicht am Original, so weit das Spanische es erträgt. Darum klingt es fremd, altertümlich, mit umgestellter Wortfolge. Das ist keine Ungeschicklichkeit: es ist bis zum Äußersten getriebene Treue. Es gab zwei Ausgaben. Eine dem Herzog von Ferrara gewidmet. Die andere Doña Gracia Nasi gewidmet, der großen jüdischen Dame, die in halb Europa Flüchtlinge rettete.",
   "Und hier gibt es eine Brücke, die man kennen sollte. Casiodoro de Reina, der Mann der Bärenbibel, benutzte diese Übersetzung und sagte es schriftlich, mit Lob. Ein katholischer Mönch auf der Flucht aus Sevilla, gestützt auf die Arbeit von Juden, die aus demselben Land vertrieben worden waren. Beide verbannt um derselben Sache willen, einander helfend, ohne sich je zu begegnen."
  ]
 },
 "it": {
  "nombre": "Italiano",
  "voz": "it-IT",
  "ui": {
   "sala": "Vetrina 16 · Museo di Storia della Bibbia",
   "titulo": "La Bibbia di Ferrara",
   "siglo": "Ferrara, 1553 · l'Antico Testamento sefardita",
   "play": "Ascolta",
   "stop": "Ferma",
   "pie": "Museo di Storia della Bibbia",
   "aviso": "Questo telefono non ha una voce italiana. Può leggere il testo."
  },
  "t": [
   "Questa è la Bibbia di quelli che se ne andarono. Nel 1492 gli ebrei furono espulsi dalla Spagna. Partirono portandosi addosso la loro lingua: continuarono a parlare spagnolo a Salonicco, a Smirne, ad Amsterdam, per secoli. E nel 1553, nella città italiana di Ferrara, il cui duca aveva dato loro rifugio, stamparono l'Antico Testamento in quella lingua che si erano portati via.",
   "La tradussero due uomini, e ciascuno aveva due nomi. Abraham Usque, che in Portogallo si era chiamato Duarte Pinel. E Yom Tob Atias, che si era chiamato Jerónimo de Vargas. Due nomi ciascuno, perché erano vissuti fingendosi cristiani per sopravvivere. Qui, finalmente, firmarono con il proprio.",
   "Tradussero dall'ebraico parola per parola, attaccati all'originale fin dove lo spagnolo regge. Per questo suona strana, antica, con l'ordine delle frasi rovesciato. Non è goffaggine: è fedeltà portata all'estremo. Se ne fecero due emissioni. Una dedicata al duca di Ferrara. L'altra dedicata a donna Gracia Nasi, la grande signora ebrea che salvava rifugiati per mezza Europa.",
   "E qui c'è un ponte che vale la pena conoscere. Casiodoro de Reina, quello della Bibbia dell'Orso, usò questa traduzione e lo disse per iscritto, con elogi. Un monaco cattolico in fuga da Siviglia, appoggiato al lavoro di ebrei espulsi dalla stessa terra. Entrambi esiliati per la stessa ragione, aiutandosi senza conoscersi."
  ]
 }
};

const $ = id => document.getElementById(id);
let actual = "es", audio = null;

function pintarIdiomas(){
  $("idiomas").innerHTML = "";
  Object.keys(GUIA).forEach(k=>{
    const b = document.createElement("button");
    b.textContent = GUIA[k].nombre;
    b.setAttribute("aria-pressed", k===actual);
    b.onclick = ()=>{ detener(); actual = k; pintar(); };
    $("idiomas").appendChild(b);
  });
}
function pintar(){
  const g = GUIA[actual];
  document.documentElement.lang = actual;
  $("ui-sala").textContent = g.ui.sala;
  $("ui-titulo").textContent = g.ui.titulo;
  $("ui-siglo").textContent = g.ui.siglo;
  $("ui-play").textContent = g.ui.play;
  $("ui-stop").textContent = g.ui.stop;
  $("ui-pie").textContent = g.ui.pie;
  $("ui-aviso").hidden = true;
  $("texto").innerHTML = "";
  g.t.forEach((p,i)=>{
    const el = document.createElement("p");
    el.className = "parrafo"; el.id = "p"+i; el.textContent = p;
    $("texto").appendChild(el);
  });
  pintarIdiomas();
}
function marcar(i){
  document.querySelectorAll(".parrafo.sonando").forEach(e=>e.classList.remove("sonando"));
  if(i>=0){ const el = $("p"+i); if(el) el.classList.add("sonando"); }
}
function detener(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(audio){ audio.pause(); audio = null; }
  marcar(-1);
  $("btn-stop").hidden = true;
  $("btn-play").hidden = false;
}

// Preferencias de voz: primero la región (México), luego el timbre masculino.
const REGION = { es:["es-MX","es-US","es-419","es"], en:["en-US","en-GB","en"], fr:["fr-FR","fr"], de:["de-DE","de"], it:["it-IT","it"] };
const HOMBRES = ["juan","jorge","diego","carlos","miguel","male","hombre","masculino","alex","aaron","daniel","fred","thomas","nicolas","mathieu","markus","yannick","hans","stefan","luca","federico","cosimo","alessio"];
const MUJERES = ["paulina","monica","mónica","angelica","angélica","esperanza","marisol","samantha","karen","moira","tessa","amelie","amélie","audrey","anna","petra","katja","alice","elsa","female","mujer","femenino"];

function elegirVoz(codigo){
  const vs = (window.speechSynthesis ? speechSynthesis.getVoices() : []);
  if(!vs.length) return null;
  const base = codigo.slice(0,2);
  for(const reg of (REGION[base] || [base])){
    const cand = vs.filter(v => v.lang.replace("_","-").toLowerCase().startsWith(reg.toLowerCase()));
    if(!cand.length) continue;
    const h = cand.find(v => HOMBRES.some(n => v.name.toLowerCase().includes(n)));
    if(h) return h;
    const neutra = cand.find(v => !MUJERES.some(n => v.name.toLowerCase().includes(n)));
    return neutra || cand[0];
  }
  return null;
}
function hayVoz(codigo){
  if(!window.speechSynthesis) return false;
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return true;
  return vs.some(v => v.lang.slice(0,2) === codigo.slice(0,2));
}
function escuchar(){
  const g = GUIA[actual];
  detener();
  $("btn-play").hidden = true;
  $("btn-stop").hidden = false;
  if(GRABACIONES[actual]){
    audio = new Audio(GRABACIONES[actual]);
    audio.onended = detener;
    audio.play();
    return;
  }
  if(!window.speechSynthesis || !hayVoz(g.voz)){
    $("ui-aviso").textContent = g.ui.aviso;
    $("ui-aviso").hidden = false;
    detener();
    return;
  }
  const vozElegida = elegirVoz(g.voz);
  g.t.forEach((p,i)=>{
    const u = new SpeechSynthesisUtterance(p);
    u.lang = g.voz; u.rate = 0.92;
    if(vozElegida) u.voice = vozElegida;
    u.onstart = ()=>marcar(i);
    if(i===g.t.length-1) u.onend = detener;
    speechSynthesis.speak(u);
  });
}
$("btn-play").onclick = escuchar;
$("btn-stop").onclick = detener;
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = ()=>{};
pintar();
</script>
</body>
</html>
