<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>La Biblia de Dalí — Museo de Historia de la Biblia</title>
<style>
  :root{ --fondo:#F3EFE6;--claro:#FCF8F0;--tinta:#1E1D1A;--cabecera:#1F4E6B;--acento:#C4482E;--marca:rgba(196,72,46,.2); }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--tinta);
    font-family:"Iowan Old Style",Georgia,"Palatino Linotype",Palatino,serif;
    font-size:20px;line-height:1.62;-webkit-text-size-adjust:100%;}
  .hoja{max-width:40rem;margin:0 auto;padding:0 0 4rem}
  header{background:var(--cabecera);color:var(--claro);padding:2.2rem 1.4rem 2rem;}
  .sala{font-size:.78em;margin:0 0 .45rem;opacity:.85}
  h1{font-size:1.8em;line-height:1.12;margin:0;font-weight:600}
  .siglo{margin:.5rem 0 0;font-size:.85em;font-style:italic;opacity:.88}
  
  .mancha{flex:none;width:70px;height:66px}

  main{padding:0 1.4rem}
  .idiomas{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.6rem 0 1.2rem}
  .idiomas button{font:inherit;font-size:.88em;padding:.6rem 1rem;min-height:48px;
    background:transparent;color:var(--tinta);border:1.5px solid rgba(40,32,25,.35);border-radius:2px;cursor:pointer}
  .idiomas button[aria-pressed="true"]{background:var(--cabecera);color:var(--claro);border-color:var(--cabecera)}
  .idiomas button:focus-visible,.control:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
  .mandos{display:flex;gap:.6rem;align-items:center;margin:0 0 1.8rem}
  .control{font:inherit;font-size:1em;display:inline-flex;align-items:center;gap:.55rem;
    padding:.85rem 1.5rem;min-height:52px;background:var(--acento);color:#FFF6E6;border:none;border-radius:2px;cursor:pointer}
  .control.secundario{background:transparent;color:var(--tinta);border:1.5px solid rgba(40,32,25,.35);padding:.85rem 1.1rem}
  .control[hidden]{display:none}
  .aviso{font-size:.8em;font-style:italic;margin:-1.2rem 0 1.8rem;color:#7a5c3e}
  p.parrafo{margin:0 0 1.15rem;transition:background-color .25s}
  p.parrafo.sonando{background:var(--marca);box-shadow:0 0 0 .35rem var(--marca)}
  footer{margin:2.8rem 1.4rem 0;padding-top:1.2rem;border-top:1px solid rgba(40,32,25,.25);
         font-size:.8em;font-style:italic;color:#7a5c3e}
  @media (prefers-reduced-motion:reduce){p.parrafo{transition:none}}

  .header-marca{display:flex;justify-content:flex-end;margin:0 0 .9rem}
  .logo-mhb{flex:none;width:56px;height:56px;color:var(--claro);opacity:.92}
  .logo-mhb svg{width:100%;height:100%}
  .header-main{display:flex;gap:1.3rem;align-items:center}
  .header-texto{flex:1}
</style>
</head>
<body>
<div class="hoja">
<header><div class="header-marca"><div aria-label="Museo de Historia de la Biblia" class="logo-mhb">
<svg aria-hidden="true" viewBox="0 0 64 64">
<path d="M10 14 h18 v36 h-18 z" fill="currentColor" opacity="0.9"></path>
<path d="M36 14 h18 v36 h-18 z" fill="currentColor" opacity="0.9"></path>
<line stroke="currentColor" stroke-width="2" x1="32" x2="32" y1="12" y2="52"></line>
</svg>
</div></div><div class="header-main"><svg aria-hidden="true" class="mancha" viewBox="0 0 70 66">
<circle cx="26" cy="26" fill="#C4482E" opacity=".55" r="19"></circle>
<circle cx="44" cy="34" fill="#D8A62C" opacity=".6" r="16"></circle>
<circle cx="32" cy="45" fill="#2F6E9B" opacity=".55" r="13"></circle>
<path d="M52 12 C56 20 58 28 55 38" fill="none" stroke="#1E1D1A" stroke-width="1.6"></path></svg><div class="header-texto">
<p class="sala" id="ui-sala"></p>
<h1 id="ui-titulo"></h1>
<p class="siglo" id="ui-siglo"></p>
</div></div></header>
<main>
<div aria-label="Idioma" class="idiomas" id="idiomas" role="group"></div>
<div class="mandos">
<button class="control" id="btn-play">▶ <span id="ui-play">Escuchar</span></button>
<button class="control secundario" hidden="" id="btn-stop"><span id="ui-stop">Detener</span></button>
</div>
<p class="aviso" hidden="" id="ui-aviso"></p>
<div id="texto"></div>
</main>
<footer id="ui-pie">Museo de Historia de la Biblia</footer>
</div>

   "Ciento cinco acuarelas, y el pintor más escandaloso del siglo veinte.",
   "En 1963, un médico de Turín llamado Giuseppe Albaretto le encargó a Salvador Dalí que ilustrara la Biblia. Albaretto era católico devoto y amigo suyo, y lo hizo con una intención declarada: que Dalí, obligado a leer la Escritura entera para pintarla, volviera a la fe.",
   "Dalí aceptó. Trabajó entre 1,963 y 1,964. El resultado se publicó en Milán, en la casa Rizzoli: cinco tomos con el texto de la Vulgata latina y las acuarelas reproducidas una por una, en una edición corta y numerada. La que usted tiene delante es aquella primera, la de 1,964.",

   "Y ahí está la paradoja que hace grande a esta pieza. La Iglesia llevaba mil quinientos años discutiendo cuál es la manera correcta de representar lo sagrado. Y una de las respuestas más poderosas del siglo veinte la dio un surrealista al que muchos tenían por un payaso.",

   "Y todavía faltan vitrinas por ver. Las que siguen ya no tratan de cómo se tradujo este Libro, sino de hasta dónde llegó."
  ]
 },
 "en": {
  "nombre": "English",
  "voz": "en-GB",
  "ui": {
   "sala": "Case 25 · Museum of the History of the Bible",

   "siglo": "Milan, 1964 · one hundred and five watercolours",
   "play": "Listen",

   "aviso": "This phone has no English voice available. You can read the text instead."
  },
  "t": [
   "One hundred and five watercolours, and the most scandalous painter of the twentieth century.",
   "In 1963 a physician from Turin named Giuseppe Albaretto commissioned Salvador Dalí to illustrate the Bible. Albaretto was a devout Catholic and a friend of his, and he did it with a declared intention: that Dalí, obliged to read the whole of Scripture in order to paint it, would come back to the faith.",
   "Dalí accepted. He worked between 1963 and 1964. The result was published in Milan, by the house of Rizzoli: five volumes with the text of the Latin Vulgate and the watercolours reproduced one by one, in a short numbered edition. The one before you is that first edition, of 1964.",
   "What he did is like nothing you have seen in the previous cases. There is no outline, no firm line, no orderly scene. There are bursts of colour, figures dissolving half-formed, huge empty spaces. Sometimes he threw the paint onto the paper and then drew on top of whatever the stain suggested to him.",
   "Compare it with the case of the engravings. Schnorr drew what the eye sees. Doré drew the light. Dalí does neither: he paints what happens inside you while you read. It is Scripture seen from within a dream.",
   "And there is the paradox that makes this piece great. The Church had spent fifteen hundred years arguing about the right way to represent the sacred. And one of the most powerful answers of the twentieth century came from a surrealist whom many took for a clown.",

   "And there are still cases to see. The ones that follow are no longer about how this Book was translated, but about how far it travelled."
  ]
 },

  },
  "t": [
   "Cent cinq aquarelles, et le peintre le plus scandaleux du vingtième siècle.",
   "En 1963, un médecin de Turin nommé Giuseppe Albaretto commanda à Salvador Dalí d'illustrer la Bible. Albaretto était catholique fervent et son ami, et il le fit avec une intention déclarée : que Dalí, obligé de lire toute l'Écriture pour la peindre, revienne à la foi.",
   "Dalí accepta. Il travailla entre 1963 et 1964. Le résultat parut à Milan, chez Rizzoli : cinq volumes avec le texte de la Vulgate latine et les aquarelles reproduites une à une, dans une édition courte et numérotée. Celle que vous avez devant vous est cette première édition, celle de 1964.",
   "Ce qu'il a fait ne ressemble à rien de ce que vous avez vu dans les vitrines précédentes. Pas de contour, pas de trait ferme, pas de scène ordonnée. Il y a des taches de couleur qui éclatent, des figures qui se dissolvent à mi-formation, d'immenses espaces blancs. Parfois il jetait la peinture sur le papier, puis dessinait par-dessus ce que la tache lui suggérait.",
   "Comparez avec la vitrine des gravures. Schnorr dessinait ce que l'on voit. Doré dessinait la lumière. Dalí ne fait ni l'un ni l'autre : il peint ce qui se passe en vous pendant que vous lisez. C'est l'Écriture vue depuis le rêve.",

   "Et il reste encore des vitrines à voir. Celles qui suivent ne parlent plus de la façon dont ce Livre fut traduit, mais de jusqu'où il est allé."
  ]
 },
 "de": {
  "nombre": "Deutsch",
  "voz": "de-DE",
  "ui": {
   "sala": "Vitrine 25 · Museum zur Geschichte der Bibel",
   "titulo": "Die Bibel von Dalí",
   "siglo": "Mailand, 1964 · hundertfünf Aquarelle",
   "play": "Anhören",
   "stop": "Anhalten",
   "pie": "Museum zur Geschichte der Bibel",
   "aviso": "Dieses Telefon hat keine deutsche Stimme. Sie können den Text lesen."
  },
  "t": [
   "Hundertfünf Aquarelle, und der skandalöseste Maler des zwanzigsten Jahrhunderts.",
   "1963 gab ein Arzt aus Turin namens Giuseppe Albaretto bei Salvador Dalí die Illustration der Bibel in Auftrag. Albaretto war ein gläubiger Katholik und sein Freund, und er tat es mit einer erklärten Absicht: Dalí sollte, gezwungen die ganze Schrift zu lesen, um sie zu malen, zum Glauben zurückfinden.",
   "Dalí nahm an. Er arbeitete zwischen 1963 und 1964. Das Ergebnis erschien in Mailand, im Hause Rizzoli: fünf Bände mit dem Text der lateinischen Vulgata und den einzeln reproduzierten Aquarellen, in einer kleinen, nummerierten Auflage. Was Sie vor sich haben, ist jene erste Ausgabe von 1964.",
   "Was er machte, gleicht nichts von dem, was Sie in den vorigen Vitrinen gesehen haben. Keine Umrisse, keine feste Linie, keine geordnete Szene. Es gibt explodierende Farbflecken, halb entstandene, sich auflösende Gestalten, riesige weiße Flächen. Manchmal warf er die Farbe aufs Papier und zeichnete dann darüber, was der Fleck ihm eingab.",
   "Vergleichen Sie es mit der Vitrine der Stiche. Schnorr zeichnete, was man sieht. Doré zeichnete das Licht. Dalí tut weder das eine noch das andere: er malt, was in einem vorgeht, während man liest. Es ist die Schrift, vom Traum her gesehen.",
   "Und da liegt das Paradox, das dieses Stück groß macht. Die Kirche hatte fünfzehnhundert Jahre darüber gestritten, wie man das Heilige richtig darstellt. Und eine der stärksten Antworten des zwanzigsten Jahrhunderts gab ein Surrealist, den viele für einen Clown hielten.",
   "Ist der Plan von Doktor Albaretto aufgegangen? Dalí starb 1989 und liegt unter der Kuppel seines eigenen Museums in Figueres begraben. Jeder mag selbst urteilen. Was von jenem Auftrag blieb, ist dies hier vor Ihnen.",
   "Und es sind noch Vitrinen zu sehen. Die folgenden handeln nicht mehr davon, wie dieses Buch übersetzt wurde, sondern davon, wie weit es gelangte."

 },
 "it": {
  "nombre": "Italiano",
  "voz": "it-IT",

   "sala": "Vetrina 25 · Museo di Storia della Bibbia",

   "stop": "Ferma",
   "pie": "Museo di Storia della Bibbia",
   "aviso": "Questo telefono non ha una voce italiana. Può leggere il testo."
  },
  "t": [
   "Centocinque acquerelli, e il pittore più scandaloso del Novecento.",
   "Nel 1963 un medico di Torino di nome Giuseppe Albaretto commissionò a Salvador Dalí di illustrare la Bibbia. Albaretto era cattolico devoto e suo amico, e lo fece con un'intenzione dichiarata: che Dalí, costretto a leggere tutta la Scrittura per dipingerla, tornasse alla fede.",
   "Dalí accettò. Lavorò fra il 1963 e il 1964. Il risultato fu pubblicato a Milano, dalla casa Rizzoli: cinque volumi con il testo della Vulgata latina e gli acquerelli riprodotti uno per uno, in un'edizione breve e numerata. Quella che ha davanti è proprio la prima, quella del 1964.",
   "Quello che fece non somiglia a nulla di ciò che ha visto nelle vetrine precedenti. Non c'è contorno, non c'è linea ferma, non c'è scena ordinata. Ci sono macchie di colore che esplodono, figure che si dissolvono a metà, enormi spazi bianchi. A volte gettava il colore sulla carta e poi disegnava sopra ciò che la macchia gli suggeriva.",

   "Ed ecco il paradosso che rende grande questo pezzo. La Chiesa aveva passato millecinquecento anni a discutere quale sia il modo giusto di rappresentare il sacro. E una delle risposte più potenti del Novecento la diede un surrealista che molti ritenevano un pagliaccio.",
   "Funzionò il piano del dottor Albaretto? Dalí morì nel 1989 ed è sepolto sotto la cupola del suo stesso museo, a Figueres. Ciascuno giudicherà. Quello che è rimasto di quella commissione è ciò che ha davanti.",

 }
};

const $ = id => document.getElementById(id);
let actual = "es", audio = null;

function pintarIdiomas(){
  $("idiomas").innerHTML = "";
  Object.keys(GUIA).forEach(k=>{
    const b = document.createElement("button");
    b.textContent = GUIA[k].nombre;
    b.setAttribute("aria-pressed", k===actual);
    b.onclick = ()=>{ detener(); actual = k; pintar(); };
    $("idiomas").appendChild(b);
  });
}
function pintar(){
  const g = GUIA[actual];
  document.documentElement.lang = actual;
  $("ui-sala").textContent = g.ui.sala;
  $("ui-titulo").textContent = g.ui.titulo;
  $("ui-siglo").textContent = g.ui.siglo;
  $("ui-play").textContent = g.ui.play;
  $("ui-stop").textContent = g.ui.stop;
  $("ui-pie").textContent = g.ui.pie;
  $("ui-aviso").hidden = true;
  $("texto").innerHTML = "";
  g.t.forEach((p,i)=>{
    const el = document.createElement("p");
    el.className = "parrafo"; el.id = "p"+i; el.textContent = p;
    $("texto").appendChild(el);
  });
  pintarIdiomas();
}
function marcar(i){
  document.querySelectorAll(".parrafo.sonando").forEach(e=>e.classList.remove("sonando"));
  if(i>=0){ const el = $("p"+i); if(el) el.classList.add("sonando"); }
}
function detener(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(audio){ audio.pause(); audio = null; }
  marcar(-1);
  $("btn-stop").hidden = true;
  $("btn-play").hidden = false;
}

// Preferencias de voz: primero la región (México), luego el timbre masculino.
const REGION = { es:["es-MX","es-US","es-419","es"], en:["en-US","en-GB","en"], fr:["fr-FR","fr"], de:["de-DE","de"], it:["it-IT","it"] };
const HOMBRES = ["juan","jorge","diego","carlos","miguel","male","hombre","masculino","alex","aaron","daniel","fred","thomas","nicolas","mathieu","markus","yannick","hans","stefan","luca","federico","cosimo","alessio"];
const MUJERES = ["paulina","monica","mónica","angelica","angélica","esperanza","marisol","samantha","karen","moira","tessa","amelie","amélie","audrey","anna","petra","katja","alice","elsa","female","mujer","femenino"];

function elegirVoz(codigo){
  const vs = (window.speechSynthesis ? speechSynthesis.getVoices() : []);
  if(!vs.length) return null;
  const base = codigo.slice(0,2);
  for(const reg of (REGION[base] || [base])){
    const cand = vs.filter(v => v.lang.replace("_","-").toLowerCase().startsWith(reg.toLowerCase()));
    if(!cand.length) continue;
    const h = cand.find(v => HOMBRES.some(n => v.name.toLowerCase().includes(n)));
    if(h) return h;
    const neutra = cand.find(v => !MUJERES.some(n => v.name.toLowerCase().includes(n)));
    return neutra || cand[0];
  }
  return null;
}
function hayVoz(codigo){
  if(!window.speechSynthesis) return false;
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return true;
  return vs.some(v => v.lang.slice(0,2) === codigo.slice(0,2));
}
function escuchar(){
  const g = GUIA[actual];
  detener();
  $("btn-play").hidden = true;
  $("btn-stop").hidden = false;
  if(GRABACIONES[actual]){
    audio = new Audio(GRABACIONES[actual]);
    audio.onended = detener;
    audio.play();
    return;
  }
  if(!window.speechSynthesis || !hayVoz(g.voz)){
    $("ui-aviso").textContent = g.ui.aviso;
    $("ui-aviso").hidden = false;
    detener();
    return;
  }
  const vozElegida = elegirVoz(g.voz);
  g.t.forEach((p,i)=>{
    const u = new SpeechSynthesisUtterance(p);
    u.lang = g.voz; u.rate = 0.92;
    if(vozElegida) u.voice = vozElegida;
    u.onstart = ()=>marcar(i);
    if(i===g.t.length-1) u.onend = detener;
    speechSynthesis.speak(u);
  });
}
$("btn-play").onclick = escuchar;
$("btn-stop").onclick = detener;
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = ()=>{};
pintar();
</script>
</body>
</html>
